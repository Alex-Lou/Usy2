name: android

# Builds the MemoCat Android app (Tauri 2, frontend/src-tauri) as an APK.
#
# One-time setup in the repo Settings:
#   - Actions must be enabled (Settings → Actions → General → Allow all actions).
#   - Variable RENDER_URL = the server URL, e.g. https://memocat.onrender.com
#     (Settings → Secrets and variables → Actions → Variables). The app calls
#     this server; the build fails without it.
#   - Signing (so each new APK installs over the previous one), as secrets:
#       ANDROID_KEYSTORE_BASE64   base64 of a .jks keystore
#       ANDROID_KEYSTORE_PASSWORD its password
#       ANDROID_KEY_ALIAS         the key alias
#       ANDROID_KEY_PASSWORD      the key password
#     Without them the APK is signed with a throwaway key: it installs, but the
#     next build will need an uninstall first.
#
# Runs on pull requests touching the app shell (build check, APK as an
# artifact), by hand (Actions → android → Run workflow), and on "android-v*"
# tags, which also attach the APK to a GitHub Release.

on:
  workflow_dispatch: {}
  push:
    tags: ["android-v*"]
  pull_request:
    paths:
      - "frontend/src-tauri/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check the server URL
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::Repository variable RENDER_URL is not set (e.g. https://memocat.onrender.com)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate the Android project
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci

      - name: Build the APK (arm64)
        env:
          VITE_API_URL: ${{ vars.RENDER_URL }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 --ci

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          echo "Built: $unsigned"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/memocat.jks"
          else
            echo "::warning::No signing secrets: using a throwaway key (uninstall before installing the next build)."
            KEYSTORE_PASSWORD=throwaway KEY_PASSWORD=throwaway KEY_ALIAS=memocat
            keytool -genkeypair -keystore "$RUNNER_TEMP/memocat.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MemoCat" >/dev/null
          fi
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p ../out
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/memocat.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out ../out/MemoCat.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify ../out/MemoCat.apk
          rm -f "$RUNNER_TEMP/memocat.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MemoCat-apk
          path: out/MemoCat.apk
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MemoCat.apk
