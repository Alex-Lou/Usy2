name: android

# Builds the MemoCat Android app (Tauri 2, frontend/src-tauri) as an APK.
#
# One-time setup in the repo Settings:
#   - Actions must be enabled (Settings → Actions → General → Allow all actions).
#   - RENDER_URL = the server URL, e.g. https://memocat.onrender.com, as a
#     repository variable OR secret (Settings → Secrets and variables →
#     Actions). The app calls this server; without it nothing is published.
#   - Signing (so each new APK installs over the previous one), as secrets:
#       ANDROID_KEYSTORE_BASE64   base64 of a .jks keystore
#       ANDROID_KEYSTORE_PASSWORD its password
#       ANDROID_KEY_ALIAS         the key alias
#       ANDROID_KEY_PASSWORD      the key password
#     Without them the APK is signed with a throwaway key: it installs, but the
#     next build will need an uninstall first.
#
# Runs on every merge into main that touches the app (the APK is then
# published at one fixed address: the "android-latest" release, see the last
# step), on pull requests touching the app shell (build check), by hand
# (Actions → android → Run workflow), and on "android-v*" tags (a versioned
# release).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
    tags: ["android-v*"]
  pull_request:
    paths:
      - "frontend/src-tauri/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # The server the app talks to. A pull request still builds without it
      # (build check only: that APK cannot reach any server).
      - name: Check the server URL
        env:
          RENDER_URL: ${{ vars.RENDER_URL || secrets.RENDER_URL }}
        run: |
          if [ -n "$RENDER_URL" ]; then
            echo "API_URL=${RENDER_URL%/}" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] && ! [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "::warning::RENDER_URL is not set (variable or secret): build check only, nothing is published (this APK cannot reach the server)."
            echo "API_URL=https://memocat.invalid" >> "$GITHUB_ENV"
          else
            echo "::error::Repository variable RENDER_URL is not set (e.g. https://memocat.onrender.com)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub runner already has the Android SDK and NDK
      # ($ANDROID_HOME, $ANDROID_NDK_LATEST_HOME).
      - name: Show the Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -n 3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate the Android project
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci

      - name: Build the APK (arm64)
        run: |
          export VITE_API_URL="$API_URL"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 --ci

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          echo "Built: $unsigned"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/memocat.jks"
          else
            echo "::warning::No signing secrets: using a throwaway key (uninstall before installing the next build)."
            KEYSTORE_PASSWORD=throwaway KEY_PASSWORD=throwaway KEY_ALIAS=memocat
            keytool -genkeypair -keystore "$RUNNER_TEMP/memocat.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MemoCat" >/dev/null
          fi
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p ../out
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/memocat.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out ../out/MemoCat.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify ../out/MemoCat.apk
          rm -f "$RUNNER_TEMP/memocat.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MemoCat-apk
          path: out/MemoCat.apk
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MemoCat.apk

      # Always the same download page for the newest APK of main:
      # https://github.com/<owner>/<repo>/releases/tag/android-latest
      - name: Publish as the latest APK
        if: github.ref == 'refs/heads/main' && env.PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MemoCat Android (dernière version)
          prerelease: true
          make_latest: false
          body: |
            Dernier APK de MemoCat, construit depuis main (${{ github.sha }}).
            Sur le téléphone : télécharger MemoCat.apk, l'ouvrir, autoriser l'installation.
          files: out/MemoCat.apk
