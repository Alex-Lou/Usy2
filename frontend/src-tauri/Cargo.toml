[package]
name = "memocat"
version = "0.1.0"
description = "MemoCat - private social app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "memocat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens web links (songs, pinned pages…) in the phone's browser/apps.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
