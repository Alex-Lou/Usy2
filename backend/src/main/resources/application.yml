spring:
  application:
    name: memocat-backend
  datasource:
    # MEMOCAT_DB_URL wins if set; otherwise the URL is composed from host/port/name
    # (so a managed Postgres that exposes those parts separately works out of the box).
    url: ${MEMOCAT_DB_URL:jdbc:postgresql://${MEMOCAT_DB_HOST:localhost}:${MEMOCAT_DB_PORT:5432}/${MEMOCAT_DB_NAME:memocat}}
    username: ${MEMOCAT_DB_USER:memocat}
    password: ${MEMOCAT_DB_PASSWORD:memocat}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # Documents up to 10 MB (images are capped at 5 MB by their own validator).
      max-file-size: 10MB
      max-request-size: 11MB

server:
  # PORT is injected by most PaaS (e.g. Render); falls back to MEMOCAT_SERVER_PORT then 8080.
  port: ${PORT:${MEMOCAT_SERVER_PORT:8080}}

memocat:
  jwt:
    # Must be at least 32 characters (256 bits) for HS256. Provide via env in all real environments.
    secret: ${MEMOCAT_JWT_SECRET:}
    expiration-minutes: ${MEMOCAT_JWT_EXPIRATION_MINUTES:1440}
  keep-alive:
    # Self-ping of the public URL so the free Render instance never idles.
    # Render sets RENDER_EXTERNAL_URL automatically; empty elsewhere = disabled.
    url: ${MEMOCAT_KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
  storage:
    # Files live in Postgres (1 GB on Render's free plan): uploads stop at this total.
    quota-mb: ${MEMOCAT_STORAGE_QUOTA_MB:800}
  # The couple's time zone: "today" for memories and dates (not the server's UTC).
  timezone: ${MEMOCAT_TIMEZONE:Atlantic/Canary}
  push:
    # VAPID "subject": how browser push services can contact the operator
    # (https URL or mailto:). Render's public URL by default.
    subject: ${MEMOCAT_PUSH_SUBJECT:${RENDER_EXTERNAL_URL:mailto:memocat@localhost}}
  cors:
    # Dev origins for the Tauri/Vite frontend.
    allowed-origins: ${MEMOCAT_CORS_ORIGINS:http://localhost:1420,http://localhost:5173,tauri://localhost}
  seed:
    accounts:
      - username: ${MEMOCAT_USER1_USERNAME:}
        password: ${MEMOCAT_USER1_PASSWORD:}
        display-name: ${MEMOCAT_USER1_DISPLAY_NAME:}
      - username: ${MEMOCAT_USER2_USERNAME:}
        password: ${MEMOCAT_USER2_PASSWORD:}
        display-name: ${MEMOCAT_USER2_DISPLAY_NAME:}
